---
- name: Deploy Docker App
  hosts: web
  become: yes
  tasks:
    - name: Update system
      yum:
        name: "*"
        state: latest

    - name: Install Docker
      yum:
        name: docker
        state: present

    - name: Start Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add ec2-user to docker group
      user:
        name: ec2-user
        groups: docker
        append: yes

    - name: Install Docker Compose
      get_url:
        url: https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64
        dest: /usr/local/bin/docker-compose
        mode: '0755'

    - name: Create app directory
      file:
        path: /app
        state: directory

    - name: Create custom HTML page
      copy:
        dest: /app/index.html
        content: |
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>Mon Site</title>
            <style>
              body {
                font-family: Arial, sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background: linear-gradient(135deg, #1F4E79, #2E75B6);
                margin: 0;
              }
              .box {
                background: white;
                padding: 50px;
                border-radius: 15px;
                text-align: center;
                box-shadow: 0 10px 30px rgba(0,0,0,0.3);
              }
              h1 { color: #1F4E79; font-size: 2.5em; }
              p  { color: #555; font-size: 1.2em; }
              .badge {
                background: #2E75B6;
                color: white;
                padding: 8px 20px;
                border-radius: 20px;
                font-size: 0.9em;
                margin-top: 20px;
                display: inline-block;
              }
            </style>
          </head>
          <body>
            <div class="box">
              <h1>👋 Hello Takoua !</h1>
              <p>✅ Tout fonctionne bien !</p>
              <p>Infrastructure déployée avec succès sur AWS</p>
              <div class="badge">Terraform + Ansible + Docker + GitHub Actions</div>
            </div>
          </body>
          </html>

    - name: Create docker-compose.yml
      copy:
        dest: /app/docker-compose.yml
        content: |
          version: '3'
          services:
            nginx:
              image: nginx:latest
              ports:
                - "80:80"
              volumes:
                - ./index.html:/usr/share/nginx/html/index.html

    - name: Run containers
      shell: cd /app && docker-compose up -d